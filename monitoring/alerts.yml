groups:
  - name: churn-api
    rules:
      - alert: ChurnApiDown
        expr: up{job="churn-api"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "L'API de churn ne répond plus"

      - alert: HighInferenceLatency
        expr: >
          histogram_quantile(0.95,
            sum by (le) (rate(churn_inference_latency_seconds_bucket[5m]))) > 0.25
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Latence d'inférence p95 > 250 ms"

      - alert: HighErrorRate
        expr: >
          sum(rate(churn_api_requests_total{status=~"5.."}[5m]))
          / clamp_min(sum(rate(churn_api_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Plus de 5 % de réponses en erreur 5xx"

      - alert: FeatureDriftDetected
        expr: churn_feature_drift_share > 0.30
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Dérive : plus de 30 % des features ont changé — envisager un réentraînement"

      - alert: ChurnRateShift
        expr: >
          sum(rate(churn_predictions_total{outcome="churn"}[1h]))
          / clamp_min(sum(rate(churn_predictions_total[1h])), 1e-9) > 0.45
        for: 30m
        labels: { severity: info }
        annotations:
          summary: "Le taux de churn prédit dépasse 45 % (≈ 27 % à l'entraînement)"

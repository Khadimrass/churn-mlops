# Configuration centrale du projet — tous les scripts lisent ce fichier.
project_name: churn-mlops

data:
  url: https://raw.githubusercontent.com/IBM/telco-customer-churn-on-icp4d/master/data/Telco-Customer-Churn.csv
  raw_path: data/raw/telco_churn.csv
  target: Churn
  id_column: customerID

split:
  test_size: 0.20        # jeu de test final (jamais vu pendant la sélection)
  val_size: 0.20         # part du reste utilisée pour la validation
  random_state: 42

features:
  numeric: [tenure, MonthlyCharges, TotalCharges]
  binary: [SeniorCitizen]
  categorical:
    [gender, Partner, Dependents, PhoneService, MultipleLines, InternetService,
     OnlineSecurity, OnlineBackup, DeviceProtection, TechSupport, StreamingTV,
     StreamingMovies, Contract, PaperlessBilling, PaymentMethod]

mlflow:
  tracking_uri: sqlite:///mlflow.db     # surchargé par la variable MLFLOW_TRACKING_URI
  experiment_name: churn-prediction
  registered_model_name: churn-classifier

# Modèles candidats comparés à chaque entraînement
models:
  logistic_regression:
    C: 1.0
    max_iter: 1000
    class_weight: balanced
  random_forest:
    n_estimators: 300
    max_depth: 10
    min_samples_leaf: 5
    class_weight: balanced
    n_jobs: -1
  lightgbm:
    n_estimators: 400
    learning_rate: 0.03
    num_leaves: 15
    min_child_samples: 30
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    class_weight: balanced
    verbose: -1

# Quality gate : le modèle n'est promu que s'il dépasse ces seuils sur le jeu de test
quality_gate:
  min_roc_auc: 0.80
  min_f1: 0.58
  min_recall: 0.65

artifacts:
  model_dir: models
  reference_path: models/reference.parquet

monitoring:
  predictions_log: data/production/predictions.jsonl
  reports_dir: reports
  psi_threshold: 0.20          # PSI > 0.2 = dérive significative
  p_value_threshold: 0.05      # tests KS / chi²
  drift_share_threshold: 0.30  # alerte si > 30 % des features dérivent
  min_samples: 100
